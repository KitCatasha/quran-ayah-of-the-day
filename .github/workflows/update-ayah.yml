name: Update daily ayah

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ayah
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate both cards and update the linked README banner
        uses: ./
        with:
          output-path: assets/ayah-light.svg
          dark-output-path: assets/ayah-dark.svg
          readme-path: README.md

      - name: Commit the new card
        run: |
          git add README.md assets/ayah-light.svg assets/ayah-dark.svg
          if git diff --cached --quiet -- README.md assets/ayah-light.svg assets/ayah-dark.svg; then
            echo "The card is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily ayah"
          git push
